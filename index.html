<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>看無字，講有聲 — 台語詞彙筆畫教學</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <script src="vocabularies.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:       #6b3fa0;
      --purple-light: #ede5f8;
      --bg:           #f5f0e8;
      --card-bg:      #ffffff;
      --border:       #e8e2da;
      --text-main:    #1a1a2e;
      --text-sub:     #888;
      --font:         'Huninn', 'PingFang TC', 'Heiti TC', sans-serif;
      --radius:       20px;
      --shadow:       0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 12px 36px rgba(107, 63, 160, 0.18);
    }

    html, body {
      height: 100%;
      background: #ffffff;
      font-family: var(--font);
      color: var(--text-main);
    }

    /* ── Header ──────────────────────────────── */
    .site-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 28px 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .site-header h1 {
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 700;
      color: var(--purple);
      letter-spacing: 0.08em;
    }
    .site-header p {
      font-size: clamp(12px, 1.8vw, 16px);
      color: var(--text-sub);
      letter-spacing: 0.04em;
    }

    /* ── Main grid area ─────────────────────── */
    .page-body {
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 32px 60px;
    }

    /* Instruction row */
    .section-label {
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: 0.06em;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Vocabulary grid ─────────────────────
       Tablet-first: 2 columns (768px+)
       Larger:       3 columns (1024px+)
       Phone:        1 column  (< 600px)
    ─────────────────────────────────────────── */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    @media (min-width: 1024px) {
      .vocab-grid { grid-template-columns: repeat(3, 1fr); gap: 28px; }
    }

    @media (max-width: 599px) {
      .page-body { padding: 24px 16px 48px; }
      .vocab-grid { grid-template-columns: 1fr; gap: 16px; }
      .site-header { padding: 20px 20px 16px; }
    }

    /* ── Vocabulary card ─────────────────────── */
    .vocab-card {
      background: #ffffff;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: transform 220ms ease, box-shadow 220ms ease;
      -webkit-tap-highlight-color: transparent;
      border: 1.5px solid transparent;
    }
    .vocab-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(107, 63, 160, 0.18);
    }
    .vocab-card:active {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    /* Full image — natural portrait ratio, no cropping */
    .vocab-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Loading skeleton ─────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .card-skeleton {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #fff;
      aspect-ratio: 595 / 964;
    }
    .card-skeleton-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f0ece6 25%, #f8f5f0 50%, #f0ece6 75%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite;
    }
  </style>
</head>
<body>

<header class="site-header">
  <h1>看無字，講有聲</h1>
  <p>台語詞彙筆畫教學 · 請選擇要練習的字帖</p>
</header>

<main class="page-body">
  <div class="section-label">共 10 款詞彙</div>
  <div class="vocab-grid" id="vocab-grid">
    <!-- 先插入骨架畫面，JS 載入後替換 -->
  </div>
</main>

<script>
  const grid = document.getElementById('vocab-grid');

  /* 先顯示骨架畫面 */
  for (let i = 0; i < 10; i++) {
    const sk = document.createElement('div');
    sk.className = 'card-skeleton';
    sk.innerHTML = '<div class="card-skeleton-inner"></div>';
    grid.appendChild(sk);
  }

  /* 等字型載入後渲染卡片 */
  document.fonts.ready.then(() => {
    grid.innerHTML = '';

    VOCABULARIES.forEach(v => {
      const a = document.createElement('a');
      a.href = 'writing.html?v=' + v.id;
      a.className = 'vocab-card';

      a.innerHTML = `<img src="${v.designImageSrc}" alt="${v.text}" loading="lazy" decoding="async">`;

      grid.appendChild(a);
    });
  });
</script>

</body>
</html>
